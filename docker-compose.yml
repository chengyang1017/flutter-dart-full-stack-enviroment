version: '3.8'

services:
  # Flutter 学习应用 - Web UI
  flutter-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flutter-playground-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - RUNNER_API_URL=http://flutter-runner:8787
      - NODE_ENV=production
    depends_on:
      flutter-runner:
        condition: service_healthy
    networks:
      - flutter-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.flutter-playground.service=app"

  # Flutter 执行引擎 - Local 模式
  flutter-runner:
    build:
      context: flutter-runner-server/docker
      dockerfile: Dockerfile
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.24.1}
        RUNNER_UID: 10001
        RUNNER_GID: 10001
    container_name: flutter-practice-runner
    environment:
      - RUNNER_EXECUTION_MODE=${RUNNER_MODE:-local}
      - RUNNER_HOST=0.0.0.0
      - RUNNER_PORT=8787
      - RUNNER_IDLE_MINUTES=30
      - FLUTTER_EXECUTABLE=/opt/flutter/bin/flutter
      - RUNNER_DOCKER_IMAGE=flutter-practice-runner:local
      - RUNNER_DOCKER_MEMORY=2048m
      - RUNNER_DOCKER_CPUS=2
      - RUNNER_ALLOWED_ORIGIN=*
      - PUB_CACHE=/home/runner/.pub-cache
    ports:
      - "${RUNNER_PORT:-8787}:8787"
    volumes:
      # 持久化 pub cache 以加速后续构建
      - flutter-pub-cache:/home/runner/.pub-cache
      # 用于 Docker in Docker (如果需要)
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - flutter-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.flutter-playground.service=runner"

  # 可选: Redis 缓存 (用于未来的会话管理)
  # redis:
  #   image: redis:7-alpine
  #   container_name: flutter-cache
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - flutter-network
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes

networks:
  flutter-network:
    driver: bridge
    name: flutter-playground-net

volumes:
  flutter-pub-cache:
    name: flutter-pub-cache
  # redis-data:
  #   name: redis-data
